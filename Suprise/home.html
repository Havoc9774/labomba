<!DOCTYPE html>
<html>
<head>
  <title>LA BOMBA</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif; 
      text-align: center; 
      margin-top: 50px;
    }
    .float-img {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
            body {
            font-family: serif;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            overflow-y: scroll;
        }
        
        h1 {
            text-align: center;
            color: #ff4444;
        }

        /* Rendering Bottleneck: Heavy CSS Filters and Box Shadows */
        .laggy-box {
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
            background: radial-gradient(circle, red, yellow, green);
            box-shadow: 0px 0px 50px 20px rgba(255, 255, 255, 0.5), 
                        inset 0px 0px 30px 10px rgba(0, 0, 0, 0.8);
            filter: blur(5px) contrast(200%) drop-shadow(10px 10px 10px blue);
            /* Non-GPU Animation: Animating width/height forces constant layout reflows */
            animation: throbbing 0.1s infinite alternate;
        }

        @keyframes throbbing {
            0% { width: 80px; height: 80px; margin-left: 5px; }
            100% { width: 120px; height: 120px; margin-left: 20px; }
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
  </style>
  
  <script>
    const POPUP_COUNT = 35; 

    const images = ["icon.png", "png.png", "png2.png", "png3.png", "png4.png", "png5.png", "png6.png", "png7.png", "png8.png", "png9.png", "png10.png", "png11.png", "png12.png", "png13.png", "png14.png", "png15.png", "png16.png", "png17.png", "png18.png", "png19.png", "png20.png", "png21.png", "png22.png", "png23.png","png24.png","png25.png","png26.png","png27.png","png28.png","png29.png","png30.png","png31.png","png32.png","png33.png","png34.png","png35.png","png36.png","png37.png", "png38.png"];
    const floatingImages = [];

    class Bouncer {
      constructor(img) {
        this.el = img;
        this.size = Math.random() * 100 + 50;
        this.x = Math.random() * (window.innerWidth - this.size);
        this.y = Math.random() * (window.innerHeight - this.size);
        this.el.style.width = this.size + "px";
        
        this.dx = (Math.random() - 0.5) * 5; 
        this.dy = (Math.random() - 0.5) * 5; 
        this.rotation = Math.random() * 700;
        this.rotationSpeed = (Math.random() - 0.5) * 5; 
        this.update();
      }

      update() {
        this.x += this.dx;
        this.y += this.dy;
        this.rotation += this.rotationSpeed;

        if (this.x <= 0 || this.x + this.size >= window.innerWidth) this.dx *= -1;
        if (this.y <= 0 || this.y + this.size >= window.innerHeight) this.dy *= -1;

        this.x = Math.max(0, Math.min(this.x, window.innerWidth - this.size));
        this.y = Math.max(0, Math.min(this.y, window.innerHeight - this.size));

        this.el.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rotation}deg)`;
      }
    }

    function spawnBouncer() {
      if (images.length === 0) return;
      const img = document.createElement("img");
      img.src = images[Math.floor(Math.random() * images.length)];
      img.classList.add("float-img");
      document.body.appendChild(img);
      const b = new Bouncer(img);
      floatingImages.push(b);
    }

    function animate() {
      for (let b of floatingImages) b.update();
      requestAnimationFrame(animate);
    }

    function triggerAllPopups() {
      openRandomPopup();
      requestAnimationFrame(triggerAllPopups);
    }

    function openRandomPopup() {
      const img = images[Math.floor(Math.random() * images.length)];
      
      // FIX: Randomised popup window height and width parameters between 150px and 550px
      const width = Math.floor(Math.random() * 400) + 150;
      const height = Math.floor(Math.random() * 400) + 150;
      
      const left = Math.floor(Math.random() * (screen.width - width));
      const top = Math.floor(Math.random() * (screen.height - height));

      const popup = window.open(
        "",
        "",
        `width=${width},height=${height},left=${left},top=${top},resizable=no,scrollbars=no`
      );

      if (popup) {
        popup.document.write(`
          <html>
            <body style="margin:0; background:black; display:flex; align-items:center; justify-content:center;">
              <img src="${img}" style="max-width:100%; max-height:100%; object-fit:contain;">
            </body>
          </html>
        `);
      }
    }

    function startChaos() {
      for (let i = 0; i < 5; i++) spawnBouncer();
      setInterval(() => {
        if (floatingImages.length < 30) spawnBouncer();
      }, 1500);
      animate();
      triggerAllPopups(); 
    }

    function runWorkerCalculation() {
        document.getElementById('result').innerText = "Starting continuous background thread loop...";
        
        const worker = new Worker('worker.js');
        
        worker.onmessage = function(e) {
            const data = e.data;
            document.getElementById('result').innerHTML = 
                `Cycles Complete: <strong>${data.cycleCount}</strong><br>Last Square Root: √<strong>${data.finalNumber}</strong> = <strong>${data.squareRoot}</strong>`;
        };
    }

    window.onload = () => {
      const startBtn = document.createElement("button");
      startBtn.innerText = "CLICK TO INITIALIZE LA BOMBA";
      startBtn.style = "position:fixed; z-index:9999; top:50%; left:50%; transform:translate(-50%, -50%); padding:20px; font-size:24px; cursor:pointer;";
      document.body.appendChild(startBtn);

      startBtn.onclick = () => {
        startBtn.remove();
        startChaos();
        runWorkerCalculation();
      };
    };

    window.onresize = () => {
      for (let b of floatingImages) {
        b.x = Math.min(b.x, window.innerWidth - b.size);
        b.y = Math.min(b.y, window.innerHeight - b.size);
      }
    };
    const grid = document.getElementById('grid');
        
        // 1. Asset & DOM Bloat: Generate 3,000 highly unoptimized elements
        for (let i = 0; i < 3000; i++) {
            const div = document.createElement('div');
            div.className = 'laggy-box';
            grid.appendChild(div);
        }

        // 2. Synchronous Render Blocking & CPU Hogging
        // This function forces the CPU to lock up synchronously on every animation frame
        function synchronousFreeze(ms) {
            const start = performance.now();
            while (performance.now() - start < ms) {
                // Do nothing, just freeze the main thread completely
            }
        }

        // 3. Layout Thrashing & Main Thread Jank Loop
        function infiniteLagLoop() {
            const boxes = document.querySelectorAll('.laggy-box');
            
            // Force Layout Thrashing by reading and writing geometric properties sequentially
            boxes.forEach(box => {
                // Read (forces style calculation)
                const currentOffset = box.offsetTop; 
                // Write (invalidates layout)
                box.style.top = (currentOffset + Math.sin(Date.now())) + 'px'; 
            });

            // Introduce a heavy synchronous network/CPU emulation lag spike (16ms = missing a full 60fps frame)
            synchronousFreeze(16);

            // Keep the nightmare going
            requestAnimationFrame(infiniteLagLoop);
        }

        // 4. Infinite API/Network Polling Emulation
        setInterval(() => {
            // Emulate rapid, unthrottled background network noise
            for(let i = 0; i < 50; i++) {
                fetch('https://typicode.com' + Math.floor(Math.random() * 100))
                    .catch(() => {}); // Ignore errors, just flood the network tab
            }
        }, 100);

        // Kick off the loop
        infiniteLagLoop();
  </script>
</head>
<body>
  <h1>LA BOMBA</h1>
  <p> go into settings and allow popups for the full experience! </p>
  <div id="result" style="margin-top:20px; font-size:18px; color:#4caf50; line-height: 1.5;"></div>
</body>
</html>
